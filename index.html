function gSave(id){const bk=$("#gb").value.trim(),dn=$("#gn").value.trim();if(!bk||!dn){toast("اسم الكتاب والمُهدي مطلوبان");return}const v={bk,dn,role:$("#gr").value,ex:$("#gx").value.trim(),n:+$("#gc").value||1,ed:$("#ge").value.trim(),y:$("#gy").value.trim(),st:$("#gs").value.trim(),dt:$("#gd").value};if(id)Object.assign(gifts.find(x=>x.id==id),v);else gifts.push({id:nid(gifts),ts:Date.now(),...v});X();toast("تم الحفظ");render()}

function syncGift(id,on){const it=id?items.find(x=>x.id==id):items[items.length-1];if(!it)return;const g=it.gid?gifts.find(x=>x.id==it.gid):null;if(!on){if(g)gifts=gifts.filter(x=>x!=g);delete it.gid;return}const v={bk:it.t+" — "+it.a,dn:$("#gn").value.trim(),role:$("#gr").value,ex:$("#gx").value.trim(),n:+($("#gc2")&&$("#gc2").value)||+$("#fn").value||1,ed:$("#ge").value.trim(),y:($("#gy2")?$("#gy2").value.trim():"")||(it.y&&it.y!="-"?String(it.y):""),st:$("#gs").value.trim(),dt:$("#gd2")?$("#gd2").value:""};if(g)Object.assign(g,v);else{const ng={id:nid(gifts),ts:Date.now(),...v};gifts.push(ng);it.gid=ng.id}}

const fd=d=>String(d).split("-").reverse().join("/"),td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function mkCard(m,W,H){const bm=await createImageBitmap(await (await fetch(m.src)).blob());try{await document.fonts.load("700 40px Cairo")}catch(e){}const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.direction="rtl";x.textAlign="center";const fam="Cairo,Tahoma,sans-serif";
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1f16");g.addColorStop(1,"#12301f");x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle="#ce1126";x.fillRect(0,0,W/3,12);x.fillStyle="#fff";x.fillRect(W/3,0,W/3,12);x.fillStyle="#007a3d";x.fillRect(2*W/3,0,W/3,12);
const top=H>1500?170:120;x.fillStyle="#fff";x.font="700 44px "+fam;x.fillText("مكتبة إعدادية دجلة الخير للبنين",W/2,top-45);
const maxW=W-200,lh=54;x.font="400 36px "+fam;const ws=(m.d||"").split(/\s+/).filter(Boolean),ls=[];let cur="";for(const w of ws){const t=cur?cur+" "+w:w;if(x.measureText(t).width>maxW&&cur){ls.push(cur);cur=w}else cur=t}if(cur)ls.push(cur);
const mx=H>1500?9:6;const L=ls.slice(0,mx);if(ls.length>mx)L[mx-1]=L[mx-1].replace(/\s*\S*$/,"")+"…";
const ph=(L.length?L.length*lh+40:0)+(m.dt?60:0),y0=top,y1=H-110-ph-(ph?30:0);
const aw=W-120,ah=y1-y0,s=Math.min(aw/bm.width,ah/bm.height),w=bm.width*s,h=bm.height*s,px=(W-w)/2,py=y0+(ah-h)/2;
x.save();x.shadowColor="rgba(0,0,0,.55)";x.shadowBlur=40;x.fillStyle="#fff";rr(x,px-10,py-10,w+20,h+20,28);x.fill();x.restore();
x.save();rr(x,px,py,w,h,20);x.clip();x.drawImage(bm,px,py,w,h);x.restore();
if(ph){const y=y1+30;x.fillStyle="rgba(255,255,255,.12)";rr(x,60,y,W-120,ph,26);x.fill();x.fillStyle="#fff";x.font="400 36px "+fam;L.forEach((t,k)=>x.fillText(t,W/2,y+20+lh*(k+1)-12));if(m.dt){x.fillStyle="#8fdcaa";x.font="600 30px "+fam;x.fillText("في: "+fd(m.dt),W/2,y+ph-20)}}
x.fillStyle="rgba(255,255,255,.6)";x.font="400 28px "+fam;x.fillText(location.host||"",W/2,H-45);
return new Promise(r=>c.toBlob(r,"image/png"))}
