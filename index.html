<style>

.note{background:#fff3cd;color:#5a4500;border-radius:10px;padding:6px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--bk);color:#fff;padding:10px 18px;border-radius:24px;z-index:60;font-size:14px;max-width:90%}
.empty{text-align:center;color:var(--mu);padding:26px 10px;grid-column:1/-1}

.cr{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd);border-inline-start:3px solid var(--gr);min-width:0}.cr.d2{border-inline-start-color:var(--rd)}.cr.d3{border-inline-start-color:var(--bk)}.cr.root{background:rgba(0,122,61,.09);margin-top:6px}.cn{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.5;min-width:0}.cn svg{width:18px;height:18px;color:var(--gr)}.cn span{flex:1;min-width:0;overflow-wrap:anywhere}.nm{font-style:normal;font-size:12px;font-weight:600;background:var(--bd);border-radius:10px;padding:0 8px;min-width:24px;text-align:center}.ca{display:flex;flex-wrap:wrap;gap:6px}.ca .btn{flex:none;min-height:36px;font-size:13px;padding:4px 10px}
.ah{background:var(--bk);color:#fff;border-radius:12px;padding:8px 14px;margin-bottom:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}.sc{overflow-x:auto}
</style>

const P={book:'<path d="M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M4 17a3 3 0 013-3h12"/>',pc:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',cmp:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',inf:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',fo:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>'};

const steps=[["cmp","ابحث عن كتاب","اكتب اسم الكتاب أو المؤلف في مربع البحث."],["book","افتح البطاقة","اضغط «عرض التفاصيل» لترى معلومات الكتاب."],["fo","تصفّح الخانات","ادخل الخانات الرئيسية ثم الفرعية، وارجع من مسار التنقل."],["pc","المكتبة الإلكترونية","اقرأ الملفات أو نزّلها متى كان ذلك مسموحًا."],["img","صور المكتبة","اضغط على أي صورة لتكبيرها."],["inf","احترم حقوق المؤلفين","اذكر المصدر ولا تنسخ جهد غيرك."]];
const grad=i=>["linear-gradient(160deg,#007a3d,#0b3d24)","linear-gradient(160deg,#ce1126,#6f0a15)","linear-gradient(160deg,#333,#000)"][i%3];
const FIXED="فكرة المشروع ومحتواه البرمجي: الأستاذ أحمد علي كنون.";let about={t:"من نحن",p:"مكتبة مدرسية لطلبة المرحلة الإعدادية في إعدادية دجلة الخير للبنين، تضم كتبًا ورقية وإلكترونية. (نص يعدّله المالك.)",img:""};
let S={v:"home",n:1,cq:"",m:"here",at:"cats",st:0,q:"",hid:0},mo=null;
const T=id=>cats.find(c=>c.id==id);
const kids=(id,all)=>cats.filter(c=>c.p==id&&(all||!c.h)).sort((a,b)=>a.o-b.o);

const path=id=>{let r=[],c=T(id);while(c){r.unshift(c);c=T(c.p)}return r};
const ps=id=>path(id).map(c=>c.n).join(" ← ");

const V={
home(){const nw=[...items].reverse().slice(0,4);return `<section class="hero"><h1>أهلًا بك في مكتبة إعدادية دجلة الخير للبنين</h1><p>ابحث عن كتابك، أو تصفّح الخانات، أو اقرأ من المكتبة الإلكترونية.</p></section><form class="sb" onsubmit="event.preventDefault();gsearch()"><input id="q" type="search" placeholder="ابحث عن كتاب أو مؤلف…" aria-label="بحث شامل"><button class="btn">بحث</button></form><div class="g"><button class="cd sec" onclick="L(1)">${ic("book")}<div><h3>المكتبة الورقية</h3><p class="mu">${inN(1).length} كتاب</p></div></button><button class="cd sec" onclick="L(2)">${ic("pc")}<div><h3>المكتبة الإلكترونية</h3><p class="mu">${inN(2).length} ملف</p></div></button><button class="cd sec" onclick="go('gallery')">${ic("img")}<div><h3>صور المكتبة</h3><p class="mu">${imgs.length} صور</p></div></button><button class="cd sec" onclick="go('guide')">${ic("cmp")}<div><h3>دليل الاستخدام</h3><p class="mu">كيف أستخدم المكتبة؟</p></div></button></div><h2>المضاف حديثًا</h2><div class="g">${nw.map(i=>card(i,1)).join("")}</div><p class="mu" style="margin-top:24px;text-align:center"><a href="#" onclick="go('admin');return false" style="color:var(--mu)">دخول المالك</a></p>`},
lib(){const c=T(S.n),pa=path(c.id);setTimeout(lr);return `<div class="bc"><a onclick="go('home')">الرئيسية</a>${pa.map((x,i)=>`<span>←</span>${i==pa.length-1?`<b>${esc(x.n)}</b>`:`<a onclick="L(${x.id})">${esc(x.n)}</a>`}`).join("")}</div><div class="tb"><button class="ib" onclick="${c.p?`L(${c.p})`:"go('home')"}" aria-label="رجوع">→</button><h1>${esc(c.n)}</h1></div><p class="mu" style="margin-bottom:10px">${inN(c.id).length} كتاب وملف في هذه الخانة وما تحتها</p><input id="cq" placeholder="ابحث هنا…" value="${esc(S.cq)}" oninput="S.cq=this.value;lr()" aria-label="بحث"><select style="margin:8px 0 12px" onchange="S.m=this.value;lr()" aria-label="نطاق البحث"><option value="here" ${S.m=="here"?"selected":""}>في هذه الخانة فقط</option><option value="tree" ${S.m=="tree"?"selected":""}>في هذه الخانة وخاناتها الفرعية</option><option value="all" ${S.m=="all"?"selected":""}>في ${esc(pa[0].n)} كاملة</option></select><div class="g" id="res"></div>`},
search(){const L_=find(items.filter(i=>vis(i.c)),S.q,0);return `<h2 style="margin-top:0">نتائج البحث عن «${esc(S.q)}»</h2><div class="g">${L_.length?L_.map(i=>card(i,1)).join(""):'<div class="empty">لم نجد نتائج. تأكد من كتابة اسم الكتاب بصورة صحيحة أو جرّب كلمة أخرى.</div>'}</div>`},
gallery(){return `<h2 style="margin-top:0">صور المكتبة</h2><div class="gal">${imgs.map((m,i)=>`<div class="gi" onclick="lb(${i})"><img loading="lazy" src="${m.src}" alt="${esc(m.d||"صورة من المكتبة")}" width="${m.w}" height="${m.h}">${m.d?`<p class="mu">${esc(m.d)}</p>`:""}</div>`).join("")}</div>`},
guide(){const s=steps[S.st];return `<h2 style="margin-top:0">دليل الاستخدام</h2><div class="cd gd">${ic(s[0])}<h3>${s[1]}</h3><p>${s[2]}</p><div class="dots">${steps.map((_,i)=>`<i class="${i==S.st?"on":""}"></i>`).join("")}</div><div class="row" style="justify-content:center"><button class="btn gh" onclick="gs(-1)">السابق</button><button class="btn" onclick="gs(1)">${S.st==steps.length-1?"إعادة العرض":"التالي"}</button><button class="btn gh" onclick="go('home')">تخطي</button></div></div>`},
about(){return `<h2 style="margin-top:0">${esc(about.t)}</h2><div class="cd">${about.img?`<img src="${about.img}" alt="" style="max-width:100%;max-height:240px;object-fit:contain;display:block;margin:0 auto 10px">`:""}${about.p.split(/\n\s*\n/).map(x=>`<p style="margin:0 0 10px">${esc(x).replace(/\n/g,"<br>")}</p>`).join("")}<p class="mu" style="border-top:1px solid var(--bd);padding-top:8px">${FIXED}</p></div>`},
admin(){if(!owner)return loginView();const tabs=[["cats","التصنيفات"],["items","الكتب والملفات"],["pics","الصور"],["abt","إدارة صفحة من نحن"],["loans","الإعارات"]];return `<div class="ah">غرفة تحرير المكتبة</div><div class="note">الصلاحيات مفروضة في قاعدة البيانات (RLS).</div><div class="tabs">${tabs.map(t=>`<button class="btn ${S.at==t[0]?"":"gh"}" onclick="S.at='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${A[S.at]()}<button class="btn gh" style="margin-top:16px" onclick="sb.auth.signOut();owner=false;go('home')">تسجيل الخروج</button>`}};
function tr(id,d){return kids(id,1).map(c=>`<div class="cr d${Math.min(d,3)}" style="margin-inline-start:${Math.min(d-1,4)*12}px"><div class="cn">${ic("fo")}<span>${c.h?"(مخفية) ":""}${esc(c.n)}</span><em class="nm">${inN(c.id).length}</em></div><div class="ca"><button class="btn sm" onclick="addCat(${c.id})">+ فرعية</button><button class="btn sm gh" onclick="editCat(${c.id})">تعديل</button><button class="btn sm gh" onclick="mvCat(${c.id})">نقل</button><button class="btn sm gh" onclick="ord(${c.id},-1)" aria-label="أعلى">↑</button><button class="btn sm gh" onclick="ord(${c.id},1)" aria-label="أسفل">↓</button><button class="btn sm gh" onclick="hid(${c.id})">${c.h?"نشر":"إخفاء"}</button>${c.p?`<button class="btn sm rd" onclick="delCat(${c.id})">حذف</button>`:""}</div></div>${tr(c.id,d+1)}`).join("")}
const opts=(ex,sel)=>cats.filter(c=>!ex.includes(c.id)).map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(ps(c.id))}</option>`).join("");
const A={
pics(){return `<div class="cd"><div class="note">رفع الصور وإدارتها متاح للمالك فقط.</div><label>إضافة صور (يمكن اختيار عدة صور)</label><input type="file" accept="image/*" multiple onchange="addPics(this.files)"></div><div class="cd" style="padding:4px;margin-top:10px">${imgs.map((m,i)=>`<div class="cr"><div class="cn"><img src="${m.src}" alt="" style="width:48px;height:48px;object-fit:contain;background:var(--bg);border-radius:8px;flex:none"><span>${esc(m.d||"بدون وصف")}</span></div><div class="ca"><button class="btn sm gh" onclick="mvPic(${i},-1)" aria-label="أعلى">↑</button><button class="btn sm gh" onclick="mvPic(${i},1)" aria-label="أسفل">↓</button><button class="btn sm gh" onclick="editPic(${i})">تعديل الوصف</button><button class="btn sm rd" onclick="delPic(${i})">حذف</button></div></div>`).join("")||'<div class="empty">لا توجد صور بعد.</div>'}</div>`},
abt(){return `<div class="cd"><label>العنوان</label><input id="at" value="${esc(about.t)}"><label>النص (افصل الفقرات بسطر فارغ)</label><textarea id="ap" rows="7">${esc(about.p)}</textarea><label>صورة (اختيارية)</label>${about.img?`<img src="${about.img}" alt="" style="max-width:100%;max-height:160px;object-fit:contain;display:block;margin:6px 0">`:""}<input type="file" accept="image/*" onchange="abImg(this.files[0])">${about.img?`<button class="btn sm gh" style="margin-top:6px" onclick="about.t=$('#at').value;about.p=$('#ap').value;about.img='';render()">إزالة الصورة</button>`:""}<p class="mu" style="margin-top:10px">الجملة الثابتة «${FIXED}» تظهر أسفل الصفحة دائمًا ولا تُعدَّل من هنا.</p><div class="row"><button class="btn" onclick="saveAbout()">حفظ</button></div></div>`},
cats(){return `<div class="row" style="margin:0 0 8px"><button class="btn" onclick="addCat(null)">+ خانة رئيسية</button></div><div class="cd" style="padding:4px">${kids(null,1).map(r=>`<div class="cr root"><div class="cn">${ic("fo")}<span>${esc(r.n)}</span><em class="nm">${inN(r.id).length}</em></div><div class="ca"><button class="btn sm" onclick="addCat(${r.id})">+ فرعية</button></div></div>${tr(r.id,1)}`).join("")}</div>`},
items(){return `<div class="row" style="margin:0 0 8px"><button class="btn" onclick="itemForm()">+ إضافة كتاب أو ملف</button></div><div class="cd" style="padding:4px">${items.map(i=>`<div class="cr"><div class="cn"><span>${esc(i.t)}<br><small class="mu" style="font-weight:400">${esc(ps(i.c))}</small></span></div><div class="ca"><button class="btn sm gh" onclick="itemForm(${i.id})">تعديل / نقل</button><button class="btn sm rd" onclick="delItem(${i.id})">حذف</button></div></div>`).join("")}</div>`},
loans(){const ob=items.filter(b=>b.k=="p"&&b.av>0).map(b=>`<option value="${b.id}">${esc(b.t)} (متاح ${b.av})</option>`).join("");return `<div class="cd"><label>اسم الطالب *</label><input id="ls"><label>الصف والشعبة</label><input id="lc"><label>الكتاب *</label><select id="lb">${ob||"<option value=''>لا توجد نسخ متاحة</option>"}</select><label>تاريخ الإرجاع المتوقع *</label><input id="ld" type="date"><div class="row"><button class="btn" onclick="addL()">تسجيل الاستعارة</button></div></div><h2>السجل</h2><div class="cd sc"><table><tr><th>الطالب</th><th>الكتاب</th><th>الإرجاع</th><th>الحالة</th><th></th></tr>${loans.map(l=>{const st=l.ret?"أُعيد":(l.due<today?"متأخر":"مستعار");return `<tr><td>${esc(l.st)}<br><small class="mu">${esc(l.cl)}</small></td><td>${esc(items.find(b=>b.id==l.b)?.t)}</td><td>${l.due}</td><td><span class="tag ${st=="متأخر"?"r":""}">${st}</span></td><td>${l.ret?"":`<button class="btn sm gh" onclick="askRet(${l.id})">إرجاع الكتاب</button>`}</td></tr>`}).join("")}</table></div>`}};
function addCat(p){M(`<h2 style="margin-top:0">${p?"خانة فرعية داخل «"+esc(T(p).n)+"»":"خانة رئيسية"}</h2><label>الاسم *</label><input id="mn"><label>وصف (اختياري)</label><input id="md"><div class="row"><button class="btn" onclick="saveCat(${p})">حفظ</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function saveCat(p){const n=$("#mn").value.trim();if(!n){toast("الاسم مطلوب");return}cats.push({id:nid(cats),p,n,d:$("#md").value,o:Math.max(0,...kids(p,1).map(c=>c.o))+1,h:0});X();toast("أُضيفت الخانة");render()}
function editCat(id){const c=T(id);M(`<h2 style="margin-top:0">تعديل الخانة</h2><label>الاسم *</label><input id="mn" value="${esc(c.n)}"><label>وصف</label><input id="md" value="${esc(c.d||"")}"><div class="row"><button class="btn" onclick="c=T(${id});if(!$('#mn').value.trim())return toast('الاسم مطلوب');c.n=$('#mn').value.trim();c.d=$('#md').value;X();toast('تم الحفظ');render()">حفظ</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function mvCat(id){M(`<h2 style="margin-top:0">نقل «${esc(T(id).n)}»</h2><p class="mu">لا يمكن وضعها داخل نفسها أو داخل خاناتها التابعة. تنتقل محتوياتها معها.</p><select id="mp">${opts([id,...desc(id)],T(id).p)}</select><div class="row"><button class="btn" onclick="doMv(${id})">نقل</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function doMv(id){const p=+$("#mp").value;if(p==id||desc(id).includes(p)){toast("نقل غير مسموح: يسبب حلقة");return}const c=T(id);c.p=p;c.o=Math.max(0,...kids(p,1).map(x=>x.o))+1;X();toast("تم النقل");render()}
function ord(id,d){const c=T(id),s=kids(c.p,1),i=s.findIndex(x=>x.id==id),o=s[i+d];if(!o)return;[c.o,o.o]=[o.o,c.o];render()}
function hid(id){const c=T(id);c.h=c.h?0:1;toast(c.h?"أُخفيت الخانة":"نُشرت الخانة");render()}
function delCat(id){const c=T(id),all=[id,...desc(id)],n=items.filter(i=>all.includes(i.c)).length;M(`<h2 style="margin-top:0">حذف «${esc(c.n)}»</h2><div class="warn">تحتوي على ${all.length-1} خانة فرعية و${n} كتاب وملف. اختر مصيرها:</div><label>نقل المحتويات إلى</label><select id="mt">${opts(all,c.p)}</select><div class="row"><button class="btn" onclick="doDel(${id},1)">نقل ثم حذف الخانة</button><button class="btn rd" onclick="doDel(${id},0)">حذف الكل نهائيًا</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function doDel(id,mv){const all=[id,...desc(id)];if(mv){const t=+$("#mt").value;kids(id,1).forEach(k=>k.p=t);items.forEach(i=>{if(i.c==id)i.c=t});cats=cats.filter(c=>c.id!=id)}else{items=items.filter(i=>!all.includes(i.c));cats=cats.filter(c=>!all.includes(c.id))}X();toast("تم الحذف");render()}
let fcv="";function itemForm(id){const b=id?items.find(x=>x.id==id):{k:"p",c:3,n:1};fcv=b.cv||"";fpdf=b.f?{p:b.f.p,n:b.f.n,sz:b.sz,pg:b.pg}:null;oldP=b.f?b.f.p:"";setTimeout(()=>{cvPrev();pdfPrev()});M(`<h2 style="margin-top:0">${id?"تعديل":"إضافة"}</h2><label>اسم الكتاب *</label><input id="ft" value="${esc(b.t)}"><label>المؤلف *</label><input id="fa" value="${esc(b.a)}"><label>الخانة *</label><select id="fc">${opts([1,2],b.c)}</select>${id?"":`<label>النوع</label><select id="fk" onchange="$('#pdfbox').style.display=this.value=='e'?'block':'none'"><option value="p">ورقي</option><option value="e">إلكتروني (PDF)</option></select>`}<div class="row"><div style="flex:1"><label>السنة</label><input id="fy" type="number" value="${b.y||""}"></div><div style="flex:1"><label>النسخ</label><input id="fn" type="number" min="1" value="${b.n||1}"></div></div><div id="pdfbox" style="display:${b.k=="e"?"block":"none"}"><label>ملف PDF</label><div id="pdp"></div><label class="btn gh" style="display:inline-flex;align-items:center;font-size:15px;margin:0">اختيار ملف PDF<input type="file" accept="application/pdf" hidden onchange="pickPdf(this.files[0])"></label><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="fdl" type="checkbox" style="width:22px;min-height:22px;flex:none" ${b.dl?"checked":""}>السماح للطلبة بالتنزيل</label></div><label>صورة غلاف الكتاب</label><div id="cvp"></div><label class="btn gh" style="display:inline-flex;align-items:center;font-size:15px;margin:0">اختيار صورة<input type="file" accept="image/*" hidden onchange="pickCv(this.files[0])"></label><label>الملخص (اختياري)</label><textarea id="fs" rows="3">${esc(b.s)}</textarea><div id="dup"></div><div class="row"><button class="btn" onclick="saveItem(${id||0},false)">حفظ</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function saveItem(id,force){const t=$("#ft").value.trim(),a=$("#fa").value.trim();if(!t||!a){toast("الاسم والمؤلف مطلوبان");return}const d=items.find(b=>b.id!=id&&nz(b.t)==nz(t)&&nz(b.a)==nz(a));if(d&&!force){$("#dup").innerHTML=`<div class="warn">تنبيه: يوجد كتاب مسجّل مسبقًا بالاسم والمؤلف نفسيهما. راجع بياناته قبل إضافة نسخة جديدة.<br><b>${esc(d.t)}</b> — ${esc(ps(d.c))}<div class="row"><button class="btn rd" onclick="saveItem(${id},true)">تأكيد الإضافة</button></div></div>`;return}
const v={t,a,c:+$("#fc").value,y:+$("#fy").value||"-",s:$("#fs").value.trim(),cv:fcv,dl:!!($("#fdl")&&$("#fdl").checked)},n=+$("#fn").value||1;if(id){const b=items.find(x=>x.id==id);Object.assign(b,v);if(b.k=="e"){b.f=fpdf?{p:fpdf.p,n:fpdf.n}:null;b.sz=fpdf?fpdf.sz:"-";b.pg=fpdf?fpdf.pg:0}if(b.k=="p"){b.av=Math.max(0,b.av+n-b.n);b.n=n}}else{const k=$("#fk").value;items.push(k=="p"?{id:nid(items),k,...v,ed:1,pg:0,n,av:n}:{id:nid(items),k,...v,f:fpdf?{p:fpdf.p,n:fpdf.n}:null,sz:fpdf?fpdf.sz:"-",pg:fpdf?fpdf.pg:0})}if(oldP&&(!fpdf||fpdf.p!=oldP))sb.storage.from("books").remove([oldP]);X();toast("تم الحفظ");render()}
function delItem(id){M(`<h2 style="margin-top:0">حذف «${esc(items.find(x=>x.id==id).t)}»؟</h2><div class="warn">لا يمكن التراجع عن الحذف.</div><div class="row"><button class="btn rd" onclick="rmItem(${id})">حذف</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function addL(){const s=$("#ls").value.trim(),b=+$("#lb").value,d=$("#ld").value;if(!s||!b||!d){toast("أكمل الحقول المطلوبة");return}const bk=items.find(x=>x.id==b);if(!bk||bk.av<1){toast("لا توجد نسخة متاحة");return}bk.av--;loans.push({id:Date.now(),st:s,cl:$("#lc").value,b,due:d,ret:null});toast("سُجّلت الاستعارة");render()}
function askRet(id){const l=loans.find(x=>x.id==id);if(!l||l.ret)return;M(`<h2 style="margin-top:0;font-size:18px">هل أنت متأكد من إرجاع هذا الكتاب؟</h2><div class="warn">الكتاب: <b>${esc(items.find(b=>b.id==l.b)?.t)}</b><br>الطالب: <b>${esc(l.st)}</b></div><div class="row"><button class="btn" onclick="ret(${id})">تأكيد الإرجاع</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function ret(id){const l=loans.find(x=>x.id==id);if(!l||l.ret){X();return}l.ret=today;items.find(b=>b.id==l.b).av++;X();toast("تم إرجاع الكتاب بنجاح");render()}
function rdImg(f,max,cb){if(!f||!f.type.startsWith("image/")||f.size>max){toast("اختر صورة صالحة بحجم أقل من "+Math.round(max/1e6)+" م.ب");return}toast("جارٍ رفع الصورة…");const n=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+((f.name.split(".").pop()||"jpg").toLowerCase());sb.storage.from("media").upload(n,f,{contentType:f.type}).then(r=>{if(r.error){toast("فشل الرفع: "+r.error.message);return}cb(sb.storage.from("media").getPublicUrl(n).data.publicUrl)})}
function cvPrev(){const e=$("#cvp");if(e)e.innerHTML=fcv?`<img src="${fcv}" alt="معاينة الغلاف" style="max-height:150px;max-width:100%;object-fit:contain;display:block;margin:4px 0"><button class="btn sm rd" style="margin-bottom:8px" onclick="fcv='';cvPrev()">إزالة الصورة</button>`:'<p class="mu">لم تُختر صورة، وسيظهر غلاف افتراضي.</p>'}
function pickCv(f){rdImg(f,5e6,d=>{fcv=d;cvPrev()})}
function addPics(fl){[...fl].forEach(f=>rdImg(f,8e6,d=>{const im=new Image();im.onload=()=>{imgs.push({id:nid(imgs),w:im.width,h:im.height,d:"",src:d});toast("تم رفع الصورة");render()};im.src=d}))}
function mvPic(i,d){const j=i+d;if(j<0||j>=imgs.length)return;[imgs[i],imgs[j]]=[imgs[j],imgs[i]];render()}
function editPic(i){M(`<h2 style="margin-top:0;font-size:18px">وصف الصورة</h2><input id="pd" value="${esc(imgs[i].d)}"><div class="row"><button class="btn" onclick="imgs[${i}].d=$('#pd').value.trim();X();toast('تم الحفظ');render()">حفظ</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function delPic(i){M(`<h2 style="margin-top:0;font-size:18px">حذف هذه الصورة؟</h2><div class="warn">لا يمكن التراجع عن الحذف.</div><div class="row"><button class="btn rd" onclick="imgs.splice(${i},1);X();toast('تم الحذف');render()">حذف</button><button class="btn gh" onclick="X()">إلغاء</button></div>`)}
function abImg(f){about.t=$("#at").value;about.p=$("#ap").value;rdImg(f,5e6,d=>{about.img=d;render()})}
function saveAbout(){const t=$("#at").value.trim();if(!t){toast("العنوان مطلوب");return}about.t=t;about.p=$("#ap").value;toast("تم حفظ صفحة من نحن");render()}
function rmItem(id){const b=items.find(x=>x.id==id);if(b&&b.f)sb.storage.from("books").remove([b.f.p]);items=items.filter(x=>x.id!=id);X();toast("تم الحذف");render()}
function pdfPrev(){const e=$("#pdp");if(e)e.innerHTML=fpdf?`<p class="mu">✔ ${esc(fpdf.n)} · ${fpdf.pg||"?"} صفحة · ${esc(fpdf.sz)}</p>`:'<p class="mu">لم يُرفع ملف بعد.</p>'}
async function pickPdf(f){if(!f)return;if(f.type!=="application/pdf"||f.size>52428800){toast("اختر ملف PDF بحجم أقل من 50 م.ب");return}const e=$("#pdp");e.innerHTML='<p class="mu">جارٍ الرفع، لا تغلق الصفحة…</p>';const p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".pdf";const r=await sb.storage.from("books").upload(p,f,{contentType:"application/pdf"});if(r.error){e.innerHTML="";toast("فشل الرفع: "+r.error.message);pdfPrev();return}let pg=0;try{pg=(await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise).numPages}catch(x){}if(fpdf&&fpdf.p!=oldP)sb.storage.from("books").remove([fpdf.p]);fpdf={p,n:f.name,pg,sz:(f.size/1048576).toFixed(1)+" م.ب"};pdfPrev();toast("تم رفع الملف، اضغط حفظ لإتمام الإضافة")}

async function readPdf(id){const b=items.find(x=>x.id==id);M(`<b>${esc(b.t)}</b><div class="row" style="justify-content:center"><button class="btn sm gh" onclick="pgo(-1)">السابق</button><span id="pn" class="mu">…</span><button class="btn sm gh" onclick="pgo(1)">التالي</button><button class="btn sm gh" onclick="X()">إغلاق</button></div><div style="overflow:auto;max-height:68vh;background:var(--bg);border-radius:8px;margin-top:8px"><canvas id="pc" style="width:100%;height:auto;display:block"></canvas></div>`);try{pv={d:await pdfjsLib.getDocument(pu(b)).promise,n:1,busy:false};drawPg()}catch(e){$("#pn").textContent="تعذّر فتح الملف"}}
async function drawPg(){const c=$("#pc");if(!c||!pv||pv.busy)return;pv.busy=true;try{const p=await pv.d.getPage(pv.n),w=c.parentElement.clientWidth||320,v0=p.getViewport({scale:1}),v=p.getViewport({scale:w/v0.width*Math.min(2,devicePixelRatio||1)});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;$("#pn").textContent=pv.n+" / "+pv.d.numPages}catch(e){}pv.busy=false}
function pgo(d){if(!pv)return;const n=pv.n+d;if(n<1||n>pv.d.numPages)return;pv.n=n;drawPg()}
